name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Download Xray engine (libv2ray.aar)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download -R 2dust/AndroidLibXrayLite -p '*.aar' -D app/libs
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2
      - name: Unit tests (parsers + config generation)
        run: gradle testDebugUnitTest --no-daemon --stacktrace
      - name: Validate generated configs with real Xray
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/xray && cd /tmp/xray
          gh release download -R XTLS/Xray-core -p 'Xray-linux-64.zip'
          unzip -q -o Xray-linux-64.zip
          fail=0
          for f in $GITHUB_WORKSPACE/app/build/test-configs/*.json; do
            echo "== $(basename $f)"
            ./xray run -test -c "$f" || fail=1
          done
          exit $fail
      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > $RUNNER_TEMP/tokmak.jks
            echo "KEYSTORE_PATH=$RUNNER_TEMP/tokmak.jks" >> $GITHUB_ENV
            echo "KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
            echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> $GITHUB_ENV
            echo "Подпись: постоянный ключ"
          else
            echo "::warning::Секреты ключа не заданы, сборка подписана временным debug-ключом (обновление поверх старой версии не получится)"
          fi
      - name: Build release APK
        run: gradle assembleRelease -PversionCode=${{ github.run_number }} --no-daemon --stacktrace
      - name: Publish APK to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk Tokmak.apk
          gh release delete latest -y --cleanup-tag || true
          gh release create latest Tokmak.apk --target "$GITHUB_SHA" --prerelease \
            --title "Tokmak — последняя сборка" \
            --notes "Автосборка из ветки main, коммит ${GITHUB_SHA::7}. Скачай Tokmak.apk и установи."
